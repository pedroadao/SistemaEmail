services:
  api:
    build: .
    container_name: email-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      # O Postgres já roda em outro projeto (PedroMailSQL/compose.yaml, container mail-sql),
      # exposto em localhost:5432. host.docker.internal alcança o host a partir do container.
      ConnectionStrings__DefaultConnection: Host=host.docker.internal;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "8080:8080"